$schema: "http://json-schema.org/draft-04/schema#"

description: snakemake configuration file

type: object

# possible entries of the config file and which type they should be
properties:
  samples:
    type: string
  out:
    type: string
  log:
    type: string
  input_dir:
    type: string
  sample_id:
    type: string
  file_types:
    type: array
    items:
      type: string    
  sample_type:
    type: string
    enum: ["Multiome-GEX", "scRNA-seq", "multiome", "scATAC-seq", "PacBio", "other"]

# entries that have to be in the config file for successful validation
required:
  - samples
  - out
  - log
  - input_dir
  - sample_id
  - file_types
  - sample_type
